name: rpc-nfsd
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/fhs:{{ .BUILD_ARG_PKGS }}"
    from: /
    to: /rootfs/usr/local/lib/containers/rpc-nfsd
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/musl:{{ .BUILD_ARG_PKGS }}"
    from: /usr/lib
    to: /rootfs/usr/local/lib/containers/rpc-nfsd/usr/lib
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/libcap:{{ .BUILD_ARG_PKGS }}"
    from: /usr/lib
    to: /rootfs/usr/local/lib/containers/rpc-nfsd/usr/lib
  - stage: libtirpc
    from: /rootfs/usr/local/lib
    to: /rootfs/usr/local/lib/containers/rpc-nfsd/usr/lib
  - stage: libtirpc
    from: /rootfs
  - stage: rpcsvc-proto
    from: /rootfs
  - stage: libevent
    from: /rootfs
  - stage: sqlite
    from: /rootfs
  # libdevmapper headers/libs: configure hard-requires them for --enable-nfsv41
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/lvm2:{{ .BUILD_ARG_PKGS }}"
  - stage: nfs-etc
    from: /rootfs/etc
    to: /rootfs/usr/local/lib/containers/rpc-nfsd/etc
steps:
  - sources:
      - url: https://www.kernel.org/pub/linux/utils/nfs-utils/{{ .NFS_UTILS_VERSION }}/nfs-utils-{{ .NFS_UTILS_VERSION }}.tar.xz
        destination: nfs-utils.tar.xz
        sha256: {{ .NFS_UTILS_SHA256 }}
        sha512: {{ .NFS_UTILS_SHA512 }}
    env:
      SOURCE_DATE_EPOCH: {{ .BUILD_ARG_SOURCE_DATE_EPOCH }}
    prepare:
      - |
        tar -xJf nfs-utils.tar.xz --strip-components=1
    build:
      - |
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/pkgconfig
        export CFLAGS="${CFLAGS} -I/usr/local/include"
        export LDFLAGS="${LDFLAGS} -L/usr/local/lib"

        ./configure \
          --prefix=/usr/local/lib/containers/rpc-nfsd \
          --sbindir=/usr/local/lib/containers/rpc-nfsd/sbin \
          --enable-nfsv4 \
          --enable-nfsv41 \
          --disable-junction \
          --disable-gss \
          --disable-svcgss \
          --disable-kprefix \
          --disable-nfsdctl \
          --without-tcp-wrappers \
          --with-rpcgen=/usr/local/bin/rpcgen \
          --with-statedir=/var/lib/nfs \
          --with-statdpath=/var/lib/nfs/statd
      - |
        # build the whole support/ tree rather than enumerating the individual
        # convenience libraries nfsd links against
        make -C support -j $(nproc)
        make -C utils/nfsd -j $(nproc)
    install:
      - |
        make DESTDIR=/rootfs install -C utils/nfsd

        # cleanup
        rm -rf /rootfs/usr/local/lib/containers/rpc-nfsd/share
      - |
        mkdir -p /rootfs/usr/local/etc/containers

        cp /pkg/rpc-nfsd.yaml /rootfs/usr/local/etc/containers/rpc-nfsd.yaml
    sbom:
      outputPath: /rootfs/usr/local/share/spdx/rpc-nfsd.spdx.json
      version: {{ .NFS_UTILS_VERSION }}
      cpes:
        - cpe:2.3:a:nfs:nfs-utils:{{ .NFS_UTILS_VERSION }}:*:*:*:*:*:*:*
      licenses:
        - GPL-2.0
finalize:
  - from: /rootfs
    to: /rootfs
